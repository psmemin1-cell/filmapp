name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PwarningsAsErrors=true --stacktrace

      - name: Assemble debug APK (Kotlin uyarıları hata sayılır)
        run: ./gradlew assembleDebug -PwarningsAsErrors=true --warning-mode all --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: cinescope-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
